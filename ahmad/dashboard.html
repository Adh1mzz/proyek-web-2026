<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dahboard Ahmad Syaifuddin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar -->
            <aside class="col-md-3 col-lg-2 bg-dark text-white p-3">
                <h4 class="text-center py-2 border-bottom border-secondary">App Name</h4>
                <ul class="nav nav-pills flex-column mt-3">
                    <li class="nav-item">
                        <a href="#" class="nav-link active">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">Data Master</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">Laporan</a>
                    </li>
                </ul>
            </aside>

            <!-- Main Content Area -->
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Dashboard Overview</h2>
                    <span class="badge bg-primary fs-6">Role: Junior Developer</span>
                </div>

                <!-- Content Grid -->
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm p-3">
                            <h6 class="text-muted">Total Data</h6>
                            <h3 class="fw-bold mb-0">1,240</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm p-3">
                            <h6 class="text-muted">Status Aktif</h6>
                            <h3 class="fw-bold text-success mb-0">98%</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm p-3">
                            <h6 class="text-muted">Pending Task</h6>
                            <h3 class="fw-bold text-warning mb-0">5</h3>
                        </div>
                    </div>
                </div>

                <!-- Disisipkan di bawah ringkasan card pada <main> -->
</body>
</html>
